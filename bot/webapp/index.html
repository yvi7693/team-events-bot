<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Календарь команды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --section: var(--tg-theme-section-bg-color, var(--bg));
    --separator: var(--tg-theme-section-separator-color, rgba(128,128,128,.2));
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .card { background: var(--section); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .spacer { flex: 1; }
  .hint { color: var(--hint); font-size: 13px; }

  .seg { display: flex; background: var(--bg2); border-radius: 9px; padding: 2px; }
  .seg button { flex: 1; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: var(--hint); }
  .seg button.on { background: var(--section); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .month-title { font-weight: 600; font-size: 17px; }
  .nav { width: 34px; height: 34px; border-radius: 50%; font-size: 20px; color: var(--link); }
  .nav:active { background: var(--bg2); }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; }
  .dow { text-align: center; font-size: 11px; color: var(--hint); padding: 4px 0; text-transform: uppercase; }
  .day { aspect-ratio: 1 / 1; border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 15px; position: relative; }
  .day.out { color: var(--hint); opacity: .55; }
  .day.today .num { color: var(--link); font-weight: 700; }
  .day.sel { background: var(--accent); color: var(--accent-text); }
  .day.sel .num { color: var(--accent-text); }
  .dots { display: flex; gap: 2px; height: 5px; align-items: center; }
  .count { font-size: 10px; line-height: 1; font-weight: 600; color: var(--link); height: 10px; }
  .day.sel .count { color: var(--accent-text); }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--link); }
  .dot.dim { opacity: .35; }
  .day.sel .dot { background: var(--accent-text); }

  .day-title { font-weight: 600; margin: 4px 4px 8px; }
  .ev { padding: 10px 12px; border-left: 3px solid var(--link); }
  .ev.dim { border-left-color: var(--hint); }
  .ev .time { font-size: 13px; color: var(--hint); }
  .ev .title { font-weight: 600; margin: 2px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); color: var(--hint); }
  .chip.me { color: var(--text); }
  .details { margin-top: 10px; border-top: 1px solid var(--separator); padding-top: 10px; display: none; }
  .ev.open .details { display: block; }
  .agenda { white-space: pre-wrap; margin: 6px 0; }
  /* кнопки: звонок → «опоздаю» → чат */
  .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .btn-row { display: grid; gap: 6px; grid-auto-columns: 1fr; grid-auto-flow: column; }
  .btn { padding: 10px 6px; border-radius: 10px; background: var(--bg2); font-size: 14px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 2px solid transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.on { border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: none; color: var(--link); }
  .answers { font-size: 13px; color: var(--hint); margin-top: 6px; }

  .empty { text-align: center; color: var(--hint); padding: 18px 0; }
  .error { color: var(--danger); text-align: center; padding: 24px 8px; }
</style>
</head>
<body>
<div id="root"><div class="empty">Загрузка…</div></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const S = {
  me: null, scope: "mine",
  month: null,            // {y, m} — m 0..11
  selected: null,         // 'YYYY-MM-DD'
  events: [], open: null, loading: false,
};
const DOW = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"];

// ---------- даты в поясе пользователя ----------
const keyFmt = () => new Intl.DateTimeFormat("en-CA", { timeZone: S.me.tz, year: "numeric", month: "2-digit", day: "2-digit" });
const timeFmt = () => new Intl.DateTimeFormat("ru-RU", { timeZone: S.me.tz, hour: "2-digit", minute: "2-digit" });
const dayKey = ts => keyFmt().format(new Date(ts * 1000));
const hm = ts => timeFmt().format(new Date(ts * 1000));
const keyOf = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return { y, m: m - 1, d }; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dayTitle = k => { const { y, m, d } = parseKey(k);
  return cap(new Date(Date.UTC(y, m, d)).toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" })); };
const monthTitle = ({ y, m }) => cap(new Date(Date.UTC(y, m, 1)).toLocaleDateString("ru-RU", { month: "long", timeZone: "UTC" })) + " " + y;

function gridDays({ y, m }) {
  const first = new Date(Date.UTC(y, m, 1));
  const shift = (first.getUTCDay() + 6) % 7;          // пн = 0
  const start = Date.UTC(y, m, 1 - shift);
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start + i * 86400000);
    days.push({ key: keyOf(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()), d: d.getUTCDate(), out: d.getUTCMonth() !== m });
  }
  return days;
}

// ---------- API ----------
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-Telegram-Init-Data": tg?.initData || "", "Content-Type": "application/json" } });
  if (!res.ok) throw new Error(res.status === 403 ? "not-registered" : `HTTP ${res.status}`);
  return res.json();
}

// ---------- загрузка с кэшем ----------
// Месяцы кэшируются и соседние подгружаются заранее: листание мгновенное,
// а свежие данные подтягиваются тихо в фоне.
const cache = new Map();                       // "scope|y-m" -> events
const monthKey = (scope, { y, m }) => `${scope}|${y}-${m}`;
const shiftMonth = ({ y, m }, n) => { const d = new Date(Date.UTC(y, m + n, 1)); return { y: d.getUTCFullYear(), m: d.getUTCMonth() }; };

async function fetchMonth(scope, month) {
  const days = gridDays(month);
  const a = parseKey(days[0].key), b = parseKey(days[41].key);
  const from = Date.UTC(a.y, a.m, a.d) / 1000 - 86400;
  const to = Date.UTC(b.y, b.m, b.d) / 1000 + 2 * 86400;
  const data = await api(`/api/events?from=${from}&to=${to}&scope=${scope}`);
  cache.set(monthKey(scope, month), data.events);
  return data.events;
}

function prefetch() {
  for (const n of [-1, 1]) {
    const month = shiftMonth(S.month, n);
    if (!cache.has(monthKey(S.scope, month))) fetchMonth(S.scope, month).catch(() => {});
  }
}

// ---------- «опоздаю»: сразу на экране, запрос в фоне ----------
const inflight = new Map();                    // "e:k" -> номер последнего запроса
let reqSeq = 0;

function replaceEverywhere(upd) {
  const swap = list => list.map(x => (x.e === upd.e && x.k === upd.k ? { ...upd, mine: x.mine } : x));
  for (const [k, list] of cache) cache.set(k, swap(list));
  S.events = swap(S.events);
}

async function toggleLate(ev) {
  const id = `${ev.e}:${ev.k}`;
  const before = ev;
  const name = S.me.name;
  const lateNames = ev.late ? ev.lateNames.filter(n => n !== name) : [...ev.lateNames, name];
  replaceEverywhere({ ...ev, late: !ev.late, lateNames });
  render();
  tg?.HapticFeedback?.selectionChanged();
  const my = ++reqSeq;
  inflight.set(id, my);
  try {
    const upd = await api("/api/rsvp", { method: "POST", body: JSON.stringify({ e: ev.e, k: ev.k, s: "late" }) });
    if (inflight.get(id) === my) { replaceEverywhere(upd); inflight.delete(id); render(); }
  } catch (e) {
    if (inflight.get(id) === my) {
      replaceEverywhere(before); inflight.delete(id); render();
      tg?.showAlert ? tg.showAlert("Не получилось сохранить, попробуй ещё раз") : alert("Не получилось сохранить");
    }
  }
}

async function openInChat(ev) {
  try {
    await api("/api/open", { method: "POST", body: JSON.stringify({ e: ev.e, k: ev.k }) });
    tg?.showAlert?.("Карточка в чате с ботом — там можно перенести или изменить ивент.", () => tg?.close());
  } catch (e) { tg?.showAlert?.("Не получилось открыть"); }
}

// ---------- отрисовка ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function eventHtml(ev) {
  const id = `${ev.e}:${ev.k}`;
  const open = S.open === id;
  const chips = [];
  if (ev.recurring) chips.push(`<span class="chip">🔁 ${esc(ev.repeat)}</span>`);
  if (ev.moved) chips.push(`<span class="chip">↪️ перенесён</span>`);
  if (ev.late) chips.push(`<span class="chip me">⏰ опоздаю</span>`);

  let details = "";
  if (open) {
    const parts = [`<div class="hint">${esc(ev.duration)}${ev.organizer ? " · орг. " + esc(ev.organizer) : ""}</div>`];
    if (ev.agenda) parts.push(`<div class="agenda">📝 ${esc(ev.agenda)}</div>`);
    if (ev.lateNames.length) parts.push(`<div class="answers">⏰ ${ev.lateNames.length === 1 ? "Опоздает" : "Опоздают"}: ${ev.lateNames.map(esc).join(", ")}</div>`);
    const rows = [];
    if (ev.url) rows.push(`<button class="btn primary" data-act="link">🔗 Подключиться к звонку</button>`);
    if (ev.mine) rows.push(`<button class="btn ${ev.late ? "on" : ""}" data-act="late">⏰ Опоздаю</button>`);
    if (ev.mine) rows.push(`<button class="btn ghost" data-act="chat">🕑 Перенести или ✏️ изменить в чате</button>`);
    parts.push(`<div class="actions">${rows.join("")}</div>`);
    details = `<div class="details">${parts.join("")}</div>`;
  }

  return `<div class="card ev ${ev.mine ? "" : "dim"} ${open ? "open" : ""}" data-id="${id}">
    <div class="time">${hm(ev.start)}–${hm(ev.end)}</div>
    <div class="title">${esc(ev.title)}</div>
    <div class="chips">${chips.join("")}</div>
    ${details}
  </div>`;
}

function render() {
  const root = document.getElementById("root");
  const today = dayKey(Date.now() / 1000);
  const byDay = {};
  for (const ev of S.events) (byDay[dayKey(ev.start)] ||= []).push(ev);

  const cells = gridDays(S.month).map(c => {
    const evs = byDay[c.key] || [];
    // до трёх ивентов — точки, больше — число, чтобы не вылезать за ячейку
    const marks = evs.length > 3
      ? `<span class="count">${evs.length}</span>`
      : `<span class="dots">${evs.map(e => `<span class="dot ${e.mine ? "" : "dim"}"></span>`).join("")}</span>`;
    const cls = ["day", c.out && "out", c.key === today && "today", c.key === S.selected && "sel"].filter(Boolean).join(" ");
    return `<button class="${cls}" data-day="${c.key}"><span class="num">${c.d}</span>${marks}</button>`;
  }).join("");

  const list = byDay[S.selected] || [];
  root.innerHTML = `
    <div class="card">
      <div class="seg">
        <button class="${S.scope === "mine" ? "on" : ""}" data-scope="mine">Мои</button>
        <button class="${S.scope === "team" ? "on" : ""}" data-scope="team">Вся команда</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="nav" data-nav="-1">‹</button>
        <div class="spacer" style="text-align:center"><span class="month-title">${monthTitle(S.month)}</span></div>
        <button class="nav" data-nav="1">›</button>
      </div>
      <div class="grid">${DOW.map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
      <div class="row" style="margin-top:6px">
        <span class="hint">время: ${esc(S.me.tzLabel)}</span><span class="spacer"></span>
        ${S.selected !== today ? `<button class="hint" style="color:var(--link)" data-act="today">Сегодня</button>` : ""}
      </div>
    </div>
    <div class="day-title">${dayTitle(S.selected)}</div>
    ${list.length ? list.map(eventHtml).join("") : `<div class="card empty">${S.loading ? "Загрузка…" : "Ивентов нет"}</div>`}`;
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-day],[data-nav],[data-scope],[data-act],.ev");
  if (t?.disabled) return;
  if (!t) return;
  if (t.dataset.day) {
    S.selected = t.dataset.day; S.open = null;
    const { y, m } = parseKey(t.dataset.day);
    if (m !== S.month.m) { S.month = { y, m }; await reload(); return; }
    render(); return;
  }
  if (t.dataset.nav) {
    let { y, m } = S.month; m += Number(t.dataset.nav);
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    S.month = { y, m }; S.selected = keyOf(y, m, 1); S.open = null;
    await reload(); return;
  }
  if (t.dataset.scope) { S.scope = t.dataset.scope; S.open = null; await reload(); return; }
  const act = t.dataset.act;
  if (act === "today") { const k = dayKey(Date.now() / 1000); const { y, m } = parseKey(k); S.selected = k; S.month = { y, m }; await reload(); return; }
  const card = t.closest(".ev");
  if (!card) return;
  const ev = S.events.find(x => `${x.e}:${x.k}` === card.dataset.id);
  if (act === "late") return toggleLate(ev);
  if (act === "link") return tg?.openLink ? tg.openLink(ev.url) : window.open(ev.url);
  if (act === "chat") return openInChat(ev);
  S.open = S.open === card.dataset.id ? null : card.dataset.id;
  render();
});

async function reload() {
  const key = monthKey(S.scope, S.month);
  const cached = cache.get(key);
  S.events = cached || [];
  S.loading = !cached;
  render();                                    // из кэша — мгновенно
  try {
    const fresh = await fetchMonth(S.scope, S.month);
    if (monthKey(S.scope, S.month) === key) {
      if (inflight.size === 0) S.events = fresh;  // не затираем ответ, который ещё летит на сервер
      S.loading = false; render();
    }
    prefetch();
  } catch (e) {
    S.loading = false;
    if (!cached) showError(e);
  }
}

function showError(e) {
  const msg = e.message === "not-registered"
    ? "Сначала нажми «Старт» у бота и выбери часовой пояс."
    : !tg?.initData ? "Открой календарь из Telegram — через кнопку в боте." : "Не удалось загрузить данные. Попробуй ещё раз.";
  document.getElementById("root").innerHTML = `<div class="card error">${msg}</div>`;
}

(async () => {
  try {
    S.me = await api("/api/me");
    S.selected = dayKey(Date.now() / 1000);
    const { y, m } = parseKey(S.selected);
    S.month = { y, m };
    await reload();
  } catch (e) { showError(e); }
})();
</script>
</body>
</html>
